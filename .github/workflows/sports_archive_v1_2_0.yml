name: Sports Archive v1.3.1 Automatic Global Football Build

on:
  push:
    branches:
      - sports-archive-v1.3.0-global-clubs
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: |
          cd sports_archive_harvester_v1_2_0
          python -m py_compile sports_harvester.py sports_harvester_external_media.py enrich_players.py enrich_players_external.py global_football_sync.py global_football_sync_v2.py
      - name: SQLite external-media and automatic global-schema smoke test
        run: |
          cd sports_archive_harvester_v1_2_0
          python sports_harvester_external_media.py report
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          import global_football_sync_v2 as g
          import sports_harvester_external_media as app
          a=app.Archive(); g.ensure_schema(a); a.close()
          p=Path('data/sports_archive.sqlite3')
          c=sqlite3.connect(p)
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert not c.execute('pragma foreign_key_check').fetchall()
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          for required in ['media_files','team_media','player_media','seasons','provider_ids','standings','provider_files','provider_runs']:
              assert required in tables, required
          assert 'media' not in tables
          columns={r[1] for r in c.execute('pragma table_info(matches)')}
          assert 'season_id' in columns
          blobs=0
          for table in tables:
              if table.startswith('sqlite_'):
                  continue
              safe='"'+table.replace('"','""')+'"'
              for col in c.execute(f'pragma table_info({safe})'):
                  name='"'+col[1].replace('"','""')+'"'
                  blobs += c.execute(f'select count(*) from {safe} where typeof({name})="blob"').fetchone()[0]
          assert blobs == 0
          print('automatic global football schema smoke test: ok; BLOB cells=0')
          PY
      - name: Verify launchers use v1.3.1 collector
        run: |
          cd sports_archive_harvester_v1_2_0
          grep -q "global_football_sync_v2.py --mode quick" QUICK_UPDATE_WINDOWS.bat
          grep -q "global_football_sync_v2.py --mode full" FULL_COLLECTION_WINDOWS.bat
          grep -q "global_football_sync_v2.py" GLOBAL_FOOTBALL_SYNC_WINDOWS.bat
      - name: Remove generated test database
        run: rm -rf sports_archive_harvester_v1_2_0/data sports_archive_harvester_v1_2_0/logs sports_archive_harvester_v1_2_0/__pycache__
      - name: Package ZIP
        run: zip -r Sports_Archive_Harvester_v1.3.1_FIXED.zip sports_archive_harvester_v1_2_0
      - uses: actions/upload-artifact@v4
        with:
          name: Sports_Archive_Harvester_v1.3.1_FIXED
          path: Sports_Archive_Harvester_v1.3.1_FIXED.zip
