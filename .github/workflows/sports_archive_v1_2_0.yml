name: Sports Archive v1.2.0 Build

on:
  push:
    branches:
      - sports-archive-v1.2.0-offline
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: |
          cd sports_archive_harvester_v1_2_0
          python -m py_compile sports_harvester.py enrich_players.py
      - name: SQLite smoke test
        run: |
          cd sports_archive_harvester_v1_2_0
          python sports_harvester.py report
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          p=Path('data/sports_archive.sqlite3')
          c=sqlite3.connect(p)
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert not c.execute('pragma foreign_key_check').fetchall()
          print('sqlite smoke test: ok')
          PY
      - name: Remove generated test database
        run: rm -rf sports_archive_harvester_v1_2_0/data sports_archive_harvester_v1_2_0/logs sports_archive_harvester_v1_2_0/__pycache__
      - name: Package ZIP
        run: zip -r Sports_Archive_Harvester_v1.2.0.zip sports_archive_harvester_v1_2_0
      - uses: actions/upload-artifact@v4
        with:
          name: Sports_Archive_Harvester_v1.2.0
          path: Sports_Archive_Harvester_v1.2.0.zip
